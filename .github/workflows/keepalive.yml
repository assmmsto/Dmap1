name: Keep Render Alive

on:
  schedule:
    - cron: '*/14 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://cgps-uim1.onrender.com)
          echo "Status: $STATUS"
          if [ "$STATUS" = "200" ]; then
            echo "✅ Render is awake"
          else
            echo "⚠️ Render returned $STATUS"
          fi
