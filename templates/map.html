<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>CGPS Map</title>
<script src="https://unpkg.com/cytoscape@3.26.0/dist/cytoscape.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,sans-serif;background:#060610;color:#e0e0e0;overflow:hidden;width:100vw;height:100vh}
#cy{width:100vw;height:100vh;position:absolute;top:0;left:0;z-index:1}
.toolbar{
  position:fixed!important;top:16px;left:16px;z-index:9999!important;
  background:rgba(12,12,22,.98);border:1px solid #333;border-radius:14px;
  padding:14px 16px;display:flex;gap:10px;flex-wrap:wrap;
  box-shadow:0 6px 28px rgba(0,0,0,.8);backdrop-filter:blur(10px);
}
.toolbar button,.toolbar a,.toolbar select{
  background:#1a1a2e;color:#e0e0e0;border:1px solid #3a3a52;
  padding:11px 18px;border-radius:10px;cursor:pointer;
  font-size:15px;text-decoration:none;white-space:nowrap;
  font-family:inherit;min-width:44px;font-weight:bold;
}
.toolbar button:hover{background:#2a2a42;border-color:#5b9eff}
.toolbar .active{background:#1f5fcf!important;border-color:#1f5fcf!important}
.toolbar select{appearance:none;padding-right:30px;font-size:14px}
.info-panel{
  position:fixed!important;top:16px;right:16px;z-index:9999!important;
  background:rgba(12,12,22,.98);border:2px solid #444;border-radius:16px;
  padding:24px;width:min(460px,92vw);max-height:82vh;overflow-y:auto;
  display:none;box-shadow:0 10px 40px rgba(0,0,0,.8);backdrop-filter:blur(10px);
}
.info-panel h3{color:#5b9eff;font-size:1.2em;margin-bottom:6px}
.file-path{font-size:11px;color:#888;margin-bottom:8px;word-break:break-all}
.badge{display:inline-block;padding:5px 14px;border-radius:14px;font-size:12px;font-weight:bold;margin:3px 4px}
.badge-py{background:#306998;color:#ffd43b}.badge-js{background:#323330;color:#f0db4f}.badge-ts{background:#3178c6;color:#fff}.badge-other{background:#444;color:#ddd}
.stat-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #1a1a2e;font-size:14px}
.stat-label{color:#999}.stat-value{font-weight:bold;font-size:15px}
.danger-badge{display:inline-block;padding:5px 16px;border-radius:5px;font-weight:bold;font-size:14px;text-transform:uppercase}
.danger-critical{background:#8B0000;color:#fff}.danger-high{background:#DC143C;color:#fff}.danger-medium{background:#FF8C00;color:#000}.danger-low{background:#FFD700;color:#000}.danger-safe{background:#228B22;color:#fff}.danger-unknown{background:#666;color:#fff}
.section{margin-top:14px}.section h4{color:#5b9eff;font-size:13px;margin-bottom:6px}
.dep-list{max-height:110px;overflow-y:auto;font-size:12px;background:#080810;border-radius:8px;padding:10px}
.dep-list span{display:block;padding:3px 0;color:#bbb;border-bottom:1px solid #111}
.legend{
  position:fixed!important;bottom:16px;left:16px;z-index:9999!important;
  background:rgba(12,12,22,.98);border:1px solid #333;border-radius:14px;
  padding:14px 18px;font-size:12px;display:flex;gap:18px;flex-wrap:wrap;
  box-shadow:0 6px 28px rgba(0,0,0,.8);backdrop-filter:blur(10px);
}
.legend-item{display:flex;align-items:center;gap:6px;font-weight:bold}
.legend-dot{width:14px;height:14px;border-radius:50%;display:inline-block;border:2px solid rgba(255,255,255,.3)}
#loading{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);font-size:20px;color:#5b9eff;z-index:10000;background:rgba(6,6,14,.98);padding:24px 40px;border-radius:14px}
@media(max-width:1024px){.info-panel{width:min(380px,85vw);max-height:70vh}}
@media(max-width:768px){.toolbar{top:10px;left:10px;padding:10px;gap:5px}.toolbar button,.toolbar a,.toolbar select{padding:8px 10px;font-size:11px}.info-panel{top:10px;right:10px;padding:12px;width:90vw;max-height:60vh}.legend{bottom:10px;left:10px;padding:8px 10px;gap:8px;font-size:9px}}
@media(max-width:480px){.toolbar{top:6px;left:6px;padding:6px;gap:3px}.toolbar button,.toolbar a,.toolbar select{padding:6px 8px;font-size:10px;min-width:32px}.info-panel{top:6px;right:6px;padding:10px;width:95vw;max-height:50vh;font-size:11px}.legend{bottom:6px;left:6px;padding:6px 8px;gap:5px;font-size:8px}}
</style>
</head>
<body>

<div style="position:fixed;bottom:50%;right:50%;transform:translate(50%,50%);opacity:0.03;pointer-events:none;z-index:0">
  <svg width="300" height="300" viewBox="0 0 400 400">
    <circle cx="200" cy="170" r="110" fill="none" stroke="#5b9eff" stroke-width="5"/>
    <polygon points="200,60 182,170 200,170" fill="#5b9eff"/>
    <polygon points="200,280 218,170 200,170" fill="#5b9eff"/>
    <circle cx="130" cy="110" r="18" fill="#5b9eff"/>
    <circle cx="280" cy="95" r="24" fill="#5b9eff"/>
    <circle cx="290" cy="220" r="14" fill="#5b9eff"/>
    <circle cx="110" cy="240" r="22" fill="#5b9eff"/>
    <text x="200" y="345" text-anchor="middle" fill="#5b9eff" font-size="38" font-weight="bold">CGPS</text>
  </svg>
</div>


<div class="toolbar">
<button onclick="cy.fit(50)">🔍</button>
<button onclick="cy.zoom(cy.zoom()*1.4)">➕</button>
<button onclick="cy.zoom(cy.zoom()*0.6)">➖</button>
<button id="lb" onclick="tl()">🏷️</button>
<button onclick="cy.center()">🎯</button>
<select onchange="cl(this.value)">
<option value="cose">🕸️ قوة</option>
<option value="constellation">🌌 كوكبة</option>
<option value="concentric">🌐 مركز</option>
</select>
<a href="/">←</a>
</div>

<div class="info-panel" id="ip">
<h3 id="pt"></h3><div class="file-path" id="pp"></div><div id="pb"></div><div id="ps"></div>
<div class="section"><h4 id="extTitle"></h4><div class="dep-list" id="ed"></div></div>
<div class="section"><h4 id="inTitle"></h4><div class="dep-list" id="dby"></div></div>
<div class="section"><h4 id="outTitle"></h4><div class="dep-list" id="don"></div></div>
</div>

<div class="legend" id="legend"></div>
<div id="loading">⏳ جاري تحميل الخريطة...</div>
<div id="cy"></div>

<script>
var L = {
ar:{loading:'⏳ جاري تحميل الخريطة...',lines:'الأسطر',complexity:'التعقيد',functions:'الدوال',classes:'الكلاسات',role:'الدور',externalDeps:'المكتبات الخارجية',dependedBy:'يعتمد عليه',dependsOn:'يعتمد على',noData:'لا يوجد',critical:'حرج',high:'عالي',medium:'متوسط',low:'منخفض',safe:'آمن',isolated:'معزول',god_file:'ملف إلهي',hub:'محوري',bridge:'جسر',leaf:'ورقي',normal:'عادي',python:'Python',javascript:'JavaScript',typescript:'TypeScript',html:'HTML',css:'CSS',json:'JSON',markdown:'Markdown',java:'Java',go:'Go',rust:'Rust',cpp:'C++',text:'نص',unknown:'غير معروف'},
en:{loading:'⏳ Loading map...',lines:'Lines',complexity:'Complexity',functions:'Functions',classes:'Classes',role:'Role',externalDeps:'External Deps',dependedBy:'Depended By',dependsOn:'Depends On',noData:'None',critical:'Critical',high:'High',medium:'Medium',low:'Low',safe:'Safe',isolated:'Isolated',god_file:'God File',hub:'Hub',bridge:'Bridge',leaf:'Leaf',normal:'Normal',python:'Python',javascript:'JavaScript',typescript:'TypeScript',html:'HTML',css:'CSS',json:'JSON',markdown:'Markdown',java:'Java',go:'Go',rust:'Rust',cpp:'C++',text:'Text',unknown:'Unknown'}
};
var lang=(new URLSearchParams(window.location.search)).get('lang')||'ar';
var T=L[lang];
document.documentElement.lang=lang;
document.documentElement.dir=lang==='ar'?'rtl':'ltr';
document.getElementById('loading').textContent=T.loading;
document.getElementById('extTitle').textContent='📦 '+T.externalDeps;
document.getElementById('inTitle').textContent='⬆️ '+T.dependedBy;
document.getElementById('outTitle').textContent='⬇️ '+T.dependsOn;
document.getElementById('legend').innerHTML=
'<div class="legend-item"><span class="legend-dot" style="background:#8B0000"></span>'+T.critical+'</div>'+
'<div class="legend-item"><span class="legend-dot" style="background:#DC143C"></span>'+T.high+'</div>'+
'<div class="legend-item"><span class="legend-dot" style="background:#FF8C00"></span>'+T.medium+'</div>'+
'<div class="legend-item"><span class="legend-dot" style="background:#FFD700"></span>'+T.low+'</div>'+
'<div class="legend-item"><span class="legend-dot" style="background:#228B22"></span>'+T.safe+'</div>'+
'<div class="legend-item"><span class="legend-dot" style="background:#808080"></span>'+T.isolated+'</div>';

var sl=false,SID='__SID__';
var dc={'critical':'#8B0000','high':'#DC143C','medium':'#FF8C00','low':'#FFD700','safe':'#228B22','unknown':'#808080'};

fetch('/api/session/'+SID).then(r=>r.json()).then(function(d){
document.getElementById('loading').style.display='none';
var el=[],ml=1;
d.graph.nodes.forEach(function(n){if(n.lines>ml)ml=n.lines});
d.graph.nodes.forEach(function(n){
var sz=30+((n.lines/ml)*55);
var color=dc[n.danger_level]||'#808080';
var icon=n.icon||'📄';
el.push({data:{
id:n.id,label:icon+' '+n.name,name:n.name,path:n.id,
language:n.language,lines:n.lines,complexity:n.complexity,
functions:n.functions,classes:n.classes,
danger_level:n.danger_level,danger_score:n.danger_score,
role:n.role,external_deps:n.external_deps||[],
depended_by:n.depended_by||[],depends_on:n.depends_on||[],
is_isolated:n.is_isolated,is_bridge:n.is_bridge,
color:color,size:sz
}})});
d.graph.edges.forEach(function(e){el.push({data:{id:e.from+'_'+e.to,source:e.from,target:e.to}})});

var cy=cytoscape({
container:document.getElementById('cy'),elements:el,
style:[
{selector:'node',css:{'label':'','font-size':'10px','color':'#fff','text-valign':'bottom','text-halign':'center','background-color':'data(color)','width':'data(size)','height':'data(size)','border-width':2,'border-color':'rgba(255,255,255,0.2)','text-background-color':'#000','text-background-opacity':0.75,'text-background-shape':'round-rectangle','text-background-padding':'3px'}},
{selector:'edge',css:{width:2,'line-color':'#4a4a5a','curve-style':'bezier',opacity:0.5}},
{selector:':selected',css:{'border-color':'#5b9eff','border-width':4}}
],
layout:{name:'cose',animate:true,animationDuration:300,nodeRepulsion:25000,idealEdgeLength:180,gravity:0.2,numIter:5000},
zoomingEnabled:true,userZoomingEnabled:true,panningEnabled:true,userPanningEnabled:true,
wheelSensitivity:0.3
});

cy.on('layoutstop',function(){cy.fit(50)});

cy.on('tap','node',function(e){
var n=e.target.data();
var langName=T[n.language]||n.language;
var dangerName=T[n.danger_level]||n.danger_level;
var roleName=T[n.role]||n.role;
document.getElementById('pt').textContent=n.label;
document.getElementById('pp').textContent='📁 '+n.path;
document.getElementById('pb').innerHTML='<span class="badge '+(n.language==='python'?'badge-py':n.language==='javascript'?'badge-js':n.language==='typescript'?'badge-ts':'badge-other')+'">'+langName+'</span><span class="danger-badge danger-'+n.danger_level+'">'+dangerName+' ('+n.danger_score+')</span>';
document.getElementById('ps').innerHTML='<div class="stat-row"><span class="stat-label">📏 '+T.lines+'</span><span class="stat-value">'+n.lines+'</span></div><div class="stat-row"><span class="stat-label">🧮 '+T.complexity+'</span><span class="stat-value">'+n.complexity+'</span></div><div class="stat-row"><span class="stat-label">⚙️ '+T.functions+'</span><span class="stat-value">'+n.functions+'</span></div><div class="stat-row"><span class="stat-label">📦 '+T.classes+'</span><span class="stat-value">'+n.classes+'</span></div><div class="stat-row"><span class="stat-label">🎭 '+T.role+'</span><span class="stat-value">'+roleName+'</span></div>';
document.getElementById('ed').innerHTML=n.external_deps.length?n.external_deps.map(function(x){return'<span>📌 '+x+'</span>'}).join(''):'<span style="color:#555">'+T.noData+'</span>';
document.getElementById('dby').innerHTML=n.depended_by.length?n.depended_by.map(function(x){return'<span>📄 '+x+'</span>'}).join(''):'<span style="color:#555">'+T.noData+'</span>';
document.getElementById('don').innerHTML=n.depends_on.length?n.depends_on.map(function(x){return'<span>📄 '+x+'</span>'}).join(''):'<span style="color:#555">'+T.noData+'</span>';
document.getElementById('ip').style.display='block';
});
cy.on('tap',function(e){if(e.target===cy)document.getElementById('ip').style.display='none'});
window.cy=cy;
}).catch(function(e){document.getElementById('loading').textContent='❌ '+e.message});

function tl(){sl=!sl;var b=document.getElementById('lb');if(sl){b.classList.add('active');cy.nodes().forEach(function(n){n.style('label',n.data('label'))})}else{b.classList.remove('active');cy.nodes().forEach(function(n){n.style('label','')})}}

function cl(name){
var layouts={
'cose':{name:'cose',animate:true,animationDuration:300,nodeRepulsion:25000,idealEdgeLength:180,gravity:0.2,numIter:3000},
'constellation':{name:'cose',animate:true,animationDuration:400,nodeRepulsion:40000,idealEdgeLength:250,gravity:0.05,numIter:4000},
'concentric':{name:'concentric',animate:true,animationDuration:300,concentric:function(node){return node.data('danger_score')||50},minNodeSpacing:60}
};
cy.layout(layouts[name]||layouts['cose']).run();
setTimeout(function(){cy.fit(50)},500);
}
</script>
</body>
</html>
