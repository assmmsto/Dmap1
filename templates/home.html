<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>CGPS</title>
<style>
:root{--bg:#0a0a14;--card:#12121e;--border:#2a2a3a;--text:#d0d0d0;--accent:#5b9eff;--green:#1a7a3a;--red:#8B0000}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:clamp(12px,3vw,24px)}
.container{width:100%;max-width:900px;margin:0 auto}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.header h1{color:var(--accent);font-size:clamp(1.3em,4vw,2em)}
.lang-btn{background:var(--card);border:1px solid var(--border);color:var(--text);padding:10px 18px;border-radius:8px;cursor:pointer;font-size:14px;text-decoration:none;font-weight:bold}
.sub{text-align:center;color:#888;margin-bottom:20px}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:clamp(16px,3vw,28px);margin-bottom:14px}
.card h3{margin-bottom:10px;font-size:clamp(0.9em,2vw,1em)}
input{display:block;width:100%;padding:clamp(10px,2vw,12px);margin:4px 0;border-radius:10px;font-size:clamp(13px,2vw,14px);font-family:inherit;background:#0a0a14;border:1px solid var(--border);color:var(--text)}
input:focus{outline:none;border-color:var(--accent)}
.upload-zone{border:2px dashed var(--border);border-radius:14px;padding:24px;text-align:center;cursor:pointer;margin-bottom:4px;transition:.2s}
.upload-zone:hover{border-color:var(--accent)}
.file-list{max-height:80px;overflow-y:auto;font-size:11px;color:#888;background:#0a0a14;border-radius:6px;padding:8px;margin:4px 0;display:none}
.file-list.show{display:block}
.file-list div{padding:2px 0;border-bottom:1px solid #111}
/* شريط الأدوات الموحد - أسفل */
.toolbar{display:flex;gap:10px;margin-top:16px}
.toolbar button{flex:1;padding:clamp(12px,2vw,16px);border-radius:10px;font-size:clamp(14px,2vw,16px);font-weight:bold;cursor:pointer;border:none;font-family:inherit;transition:.2s}
.btn-analyze{background:var(--green);color:#fff}
.btn-analyze:hover{background:#219a4a}
.btn-analyze:disabled{background:#333;cursor:not-allowed}
.btn-clear{background:var(--red);color:#fff}
.btn-clear:hover{background:#a01020}
/* Progress */
#progress{display:none;text-align:center;padding:12px;margin-top:8px}
.progress-bar{width:100%;height:6px;background:#1a1a2a;border-radius:3px;overflow:hidden;margin:8px 0}
.progress-fill{height:100%;background:var(--accent);border-radius:3px;width:0;transition:width .3s}
#progress-text{color:#aaa;font-size:13px}
.error{color:#f66;font-size:13px;text-align:center;margin:6px 0;display:none}
input[type=file]{display:none}
@media(max-width:768px){body{padding:8px}.container{max-width:100%}}
@media(max-width:480px){body{padding:6px}.header h1{font-size:1.3em}.toolbar{gap:4px}.toolbar button{padding:8px 10px;font-size:11px}.card{padding:10px}}
</style>
</head>
<body>
<div class="container">
<div class="header">
<div style="display:flex;align-items:center;gap:10px">
<svg width="40" height="40" viewBox="0 0 400 400" style="flex-shrink:0">
  <circle cx="200" cy="170" r="110" fill="none" stroke="#5b9eff" stroke-width="8"/>
  <polygon points="200,60 180,170 200,170" fill="#DC143C"/>
  <polygon points="200,280 220,170 200,170" fill="#5b9eff"/>
  <circle cx="200" cy="170" r="10" fill="#fff"/>
</svg>
<h1>CGPS</h1>
</div><a href="?lang=en" class="lang-btn" id="langBtn">🇬🇧 English</a></div>
<p class="sub" id="subtitle">خريطة ذهنية لمشروعك البرمجي</p>

<!-- رفع ملفات -->
<div class="card">
<h3>📤 رفع الملفات</h3>
<div class="upload-zone" id="uz"><p style="font-size:28px">📁</p><p id="uzText">اضغط لاختيار ملفات</p></div>
<input type="file" id="fi" multiple>
<div class="file-list" id="fl"></div>
</div>

<!-- مسار محلي -->
<div class="card">
<h3>📂 مسار محلي</h3>
<input type="text" id="lp" placeholder="/data/data/com.termux/files/home/CGPS">
</div>

<!-- GitHub -->
<div class="card">
<h3>🐙 GitHub</h3>
<input type="text" id="gu" placeholder="https://github.com/user/repo">
<input type="password" id="gt" placeholder="Token (اختياري)">
</div>

<!-- شريط الأدوات الموحد -->
<div class="toolbar">
<button class="btn-analyze" id="btnAnalyze" onclick="startAnalysis()">🚀 تحليل</button>
<button class="btn-clear" onclick="clearAll()">🔄 تنظيف</button>
</div>

<!-- Progress -->
<div id="progress">
<div class="progress-bar"><div class="progress-fill" id="pf"></div></div>
<p id="progress-text"></p>
</div>
<div class="error" id="er"></div>
</div>

<script>
var T={ar:{sub:'خريطة ذهنية لمشروعك البرمجي',uz:'اضغط لاختيار ملفات',progress:'جاري التحليل',done:'✅ اكتمل',errFile:'اختر ملفات',errPath:'أدخل مساراً',errGh:'أدخل رابط المستودع',langBtn:'🇬🇧 English'},en:{sub:'Code Mind Map',uz:'Click to select files',progress:'Analyzing',done:'✅ Complete',errFile:'Select files',errPath:'Enter path',errGh:'Enter repo URL',langBtn:'🇸🇦 العربية'}};
var lang=(new URLSearchParams(window.location.search)).get('lang')||'ar';
var t=T[lang];
document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';
document.getElementById('langBtn').textContent=t.langBtn;
document.getElementById('langBtn').href='?lang='+(lang==='ar'?'en':'ar');
document.getElementById('subtitle').textContent=t.sub;
document.getElementById('uzText').textContent=t.uz;

var files=[],activeTab=null;

// رفع الملفات
document.getElementById('uz').onclick=function(){document.getElementById('fi').click()};
document.getElementById('fi').onchange=function(e){
files=Array.from(e.target.files);
var fl=document.getElementById('fl');
fl.innerHTML='';fl.classList.add('show');
files.forEach(function(f){var d=document.createElement('div');d.textContent='📄 '+f.name;fl.appendChild(d)});
activeTab='upload';
};

// تحديد التبويب النشط عند الضغط على أي حقل
document.getElementById('lp').onfocus=function(){activeTab='path';files=[];document.getElementById('fl').classList.remove('show')};
document.getElementById('gu').onfocus=function(){activeTab='github';files=[];document.getElementById('fl').classList.remove('show')};
document.getElementById('gt').onfocus=function(){activeTab='github'};

function clearAll(){
files=[];
document.getElementById('fi').value='';
document.getElementById('lp').value='';
document.getElementById('gu').value='';
document.getElementById('gt').value='';
document.getElementById('fl').classList.remove('show');
document.getElementById('fl').innerHTML='';
document.getElementById('progress').style.display='none';
document.getElementById('er').style.display='none';
document.getElementById('pf').style.width='0%';
document.getElementById('progress-text').textContent='';
}

function showProgress(){document.getElementById('progress').style.display='block';document.getElementById('er').style.display='none'}
function showError(m){document.getElementById('progress').style.display='none';document.getElementById('er').style.display='block';document.getElementById('er').textContent='❌ '+m}

function startAnalysis(){
var url,fd=new FormData();

if(activeTab==='upload'){
if(!files.length){showError(t.errFile);return}
files.forEach(function(f){fd.append('files',f,f.name)});
url='/api/upload';
}else if(activeTab==='path'){
var p=document.getElementById('lp').value.trim();
if(!p){showError(t.errPath);return}
fd.append('path',p);
url='/api/analyze-path';
}else if(activeTab==='github'){
var u=document.getElementById('gu').value.trim();
if(!u){showError(t.errGh);return}
fd.append('repo_url',u);
var tk=document.getElementById('gt').value.trim();
if(tk)fd.append('token',tk);
url='/api/analyze-github';
}else{
// Auto-detect: أي حقل فيه بيانات
var p=document.getElementById('lp').value.trim();
var u=document.getElementById('gu').value.trim();
if(files.length>0){activeTab='upload';startAnalysis();return}
if(p){activeTab='path';startAnalysis();return}
if(u){activeTab='github';startAnalysis();return}
showError('املأ أحد الحقول أولاً');
return;
}

fd.append('language',lang);
showProgress();
var pf=document.getElementById('pf'),pm=document.getElementById('progress-text');
var startTime=Date.now();

fetch(url,{method:'POST',body:fd}).then(r=>r.json()).then(function(d){
if(!d.session_id){showError(d.detail||'Error');return}
var iv=setInterval(function(){
var elapsed=Math.floor((Date.now()-startTime)/1000);
pf.style.width=Math.min(elapsed*2,95)+'%';
pm.textContent=t.progress+' ('+elapsed+'s)';
fetch('/api/progress/'+d.session_id).then(r=>r.json()).then(function(p){
if(p.stage==='done'){clearInterval(iv);pf.style.width='100%';pm.textContent=t.done+' ('+elapsed+'s)';setTimeout(function(){location='/map/'+d.session_id+'?lang='+lang},300)}
if(p.stage==='error'){clearInterval(iv);showError(p.message||'Error')}
});
},500);
}).catch(function(e){showError(e.message)});
}
</script>
</body>
</html>
