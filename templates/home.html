<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>D-Map</title>
<style>
:root{--bg:#0a0a14;--card:#12121e;--border:#2a2a3a;--text:#d0d0d0;--accent:#5b9eff;--green:#1a7a3a;--red:#8B0000}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;font-size:17px}
.container{max-width:700px;margin:0 auto}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px}
.header h1{color:var(--accent);font-size:2.2em}
.lang-btn{background:var(--card);border:1px solid var(--border);color:var(--text);padding:8px 14px;border-radius:8px;cursor:pointer;font-size:18px;text-decoration:none}
.badge-row{text-align:center;margin-bottom:16px}
.badge{display:inline-block;background:var(--accent);color:#000;padding:4px 12px;border-radius:12px;font-size:12px;font-weight:bold;margin:3px}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px;margin-bottom:14px}
.card h3{margin-bottom:12px;color:var(--accent)}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tab{flex:1;padding:10px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--text);cursor:pointer;text-align:center;font-weight:bold;font-size:14px}
.tab.active{background:var(--accent);color:#000;border-color:var(--accent)}
.tab-content{display:none}
.tab-content.active{display:block}
input{width:100%;padding:14px;font-size:16px;margin:6px 0;border-radius:10px;background:#0a0a14;border:1px solid var(--border);color:var(--text);font-family:inherit;font-size:14px}
.upload-zone{border:2px dashed var(--border);border-radius:14px;padding:30px;text-align:center;cursor:pointer;margin:8px 0}
.upload-zone:hover{border-color:var(--accent)}
.btn{width:100%;padding:16px;border-radius:10px;font-size:18px;font-weight:bold;cursor:pointer;border:none;margin:4px 0}
.btn-analyze{background:var(--green);color:#fff}
.btn-analyze:disabled{background:#333;cursor:not-allowed}
#progress{display:none;text-align:center;padding:12px;margin:8px 0}
.progress-bar{width:100%;height:8px;background:#1a1a2a;border-radius:4px;overflow:hidden}
.progress-fill{height:100%;background:var(--accent);width:0;transition:width .3s;border-radius:4px}
#stats{display:none;margin-top:12px;padding:12px;background:#0a0a14;border-radius:10px}
.stat{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid #111}
.file-list{max-height:120px;overflow-y:auto;font-size:12px;color:#888;background:#0a0a14;border-radius:8px;padding:8px;margin:4px 0;display:none}
.file-list.show{display:block}
input[type=file]{display:none}
</style>
</head>
<body>
<div class="container">

<div class="header">
<h1><span style="color:#ff8c00">D</span><span style="color:#fff">-Map</span></h1>
<a class="lang-btn" id="langBtn" href="#">🇸🇦</a>
</div>
<div class="badge-row">
<span class="badge" data-tr="fast">⚡ سريع</span>
<span class="badge" data-tr="ai">🧠 ذكي</span>
<span class="badge" data-tr="secure">🔒 آمن</span>
</div>

<div class="tabs">
<button class="tab active" onclick="switchTab('upload')" data-tr="tab-upload">📤 رفع ملفات</button>
<button class="tab" onclick="switchTab('path')" data-tr="tab-path">📂 مسار محلي</button>
<button class="tab" onclick="switchTab('github')" data-tr="tab-github">GitHub</button>
</div>

<div class="tab-content active" id="tab-upload">
<div class="card">
<div class="upload-zone" id="dropZone" onclick="document.getElementById('fileInput').click()">
<p style="font-size:32px">📁</p><p data-tr="drop-text">اضغط أو اسحب الملفات هنا</p>
</div>
<input type="file" id="fileInput" multiple>
<div class="file-list" id="fileList"></div>
</div>
</div>

<div class="tab-content" id="tab-path">
<div class="card">
<input type="text" id="pathInput" placeholder="/data/data/com.termux/files/home/CGPS">
</div>
</div>

<div class="tab-content" id="tab-github">
<div class="card">
<h3><span data-tr="github-title">مستودع GitHub</span></h3>

<label style="display:flex;align-items:center;gap:8px;margin:10px 0 4px;color:#aaa;font-size:13px">
<span>🔗</span><span data-tr="github-url-label">رابط المستودع</span>
</label>
<input type="text" id="githubInput" data-tr-placeholder="github-placeholder" placeholder="">
<small style="color:#666;font-size:11px;display:block;margin:2px 0 10px" data-tr="github-url-hint">يدعم: user/repo أو https://github.com/user/repo</small>

<label style="display:flex;align-items:center;gap:8px;margin:10px 0 4px;color:#aaa;font-size:13px">
<span>🔑</span><span data-tr="github-token-label">رمز الوصول</span>
<span style="background:#FFD700;color:#000;font-size:10px;padding:2px 8px;border-radius:8px" data-tr="optional">اختياري</span>
</label>
<input type="text" id="tokenInput" data-tr-placeholder="token-placeholder" placeholder="">
<small style="color:#666;font-size:11px;display:block;margin:2px 0" data-tr="token-hint"></small>
</div>
</div>

<button class="btn btn-analyze" id="analyzeBtn" onclick="startAnalysis()" data-tr="analyze">🚀 تحليل المشروع</button>

<div id="progress">
<div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
<p id="progressText" style="color:#aaa;margin-top:6px"></p>
</div>

<div id="stats"></div>
</div>

<script>
// ============ الترجمة ============

'github-token-label':'Access Token',optional:'Optional'}
};

var lang=(new URLSearchParams(window.location.search)).get('lang')||'ar';
var t=T[lang];
document.documentElement.lang=lang;
document.documentElement.dir=lang==='ar'?'rtl':'ltr';

// تطبيق الترجمة
document.querySelectorAll('[data-tr]').forEach(function(el){
el.textContent=t[el.getAttribute('data-tr')]||el.textContent;
});
document.querySelectorAll('[data-tr-placeholder]').forEach(function(el){
el.placeholder=t[el.getAttribute('data-tr-placeholder')]||el.placeholder;
});
// تحديث عناصر data-tr التي لها محتوى افتراضي
var hint=document.querySelector('[data-tr="token-hint"]');
if(hint)hint.textContent=t.tokenHint||'';
document.getElementById('langBtn').textContent=t.langBtn;
document.getElementById('langBtn').href='?lang='+(lang==='ar'?'en':'ar');

// ============ المنطق ============
var activeTab='upload',selectedFiles=[];

function switchTab(tab){
activeTab=tab;
document.querySelectorAll('.tab').forEach(function(el){el.classList.remove('active')});
document.querySelectorAll('.tab-content').forEach(function(el){el.classList.remove('active')});
document.querySelector('[onclick="switchTab(\''+tab+'\')"]').classList.add('active');
document.getElementById('tab-'+tab).classList.add('active');
}

document.getElementById('fileInput').onchange=function(e){
selectedFiles=Array.from(e.target.files);
var list=document.getElementById('fileList');
list.innerHTML=selectedFiles.map(function(f){return'📄 '+f.name}).join('<br>');
list.classList.add('show');
};

var dz=document.getElementById('dropZone');
dz.ondragover=function(e){e.preventDefault();dz.style.borderColor='#5b9eff'};
dz.ondragleave=function(){dz.style.borderColor='#2a2a3a'};
dz.ondrop=function(e){
e.preventDefault();dz.style.borderColor='#2a2a3a';
selectedFiles=Array.from(e.dataTransfer.files);
var list=document.getElementById('fileList');
list.innerHTML=selectedFiles.map(function(f){return'📄 '+f.name}).join('<br>');
list.classList.add('show');
};

function startAnalysis(){
var formData=new FormData(),url='';

if(activeTab==='upload'){
if(!selectedFiles.length)return alert(t.noFile);
selectedFiles.forEach(function(f){formData.append('files',f)});
url='/api/upload';
}else if(activeTab==='path'){
var path=document.getElementById('pathInput').value.trim();
if(!path)return alert(t.noPath);
formData.append('path',path);
url='/api/analyze-path';
}else{
var repo=document.getElementById('githubInput').value.trim();
if(!repo)return alert(t.noRepo);
formData.append('repo_url',repo);
var token=document.getElementById('tokenInput').value.trim();
if(token)formData.append('token',token);
url='/api/analyze-github';
}

var btn=document.getElementById('analyzeBtn');
btn.disabled=true;btn.textContent=t.analyzing;

var progress=document.getElementById('progress');
var fill=document.getElementById('progressFill');
var text=document.getElementById('progressText');
var stats=document.getElementById('stats');
progress.style.display='block';stats.style.display='none';

var startTime=Date.now();

fetch(url,{method:'POST',body:formData})
.then(function(r){return r.json()})
.then(function(data){
if(!data.session_id)throw new Error(data.detail||t.error);
var sid=data.session_id;
var interval=setInterval(function(){
var elapsed=Math.floor((Date.now()-startTime)/1000);
fill.style.width=Math.min(elapsed*3,90)+'%';
text.textContent=t.processing+' ('+elapsed+'s)';

fetch('/api/progress/'+sid)
.then(function(r){return r.json()})
.then(function(p){
if(p.stage==='done'){
clearInterval(interval);
fill.style.width='100%';
text.textContent=t.done+' ('+elapsed+'s)';
btn.disabled=false;btn.textContent=t.analyze;

fetch('/api/session/'+sid)
.then(function(r){return r.json()})
.then(function(s){
if(s.summary){
var sum=s.summary;
stats.innerHTML=
'<h3 style="color:#5b9eff">'+t.stats+'</h3>'+
'<div class="stat"><span>'+t.files+'</span><span>'+sum.total_files+'</span></div>'+
'<div class="stat"><span>'+t.lines+'</span><span>'+sum.total_lines+'</span></div>'+
'<div class="stat"><span>'+t.critical+'</span><span>'+(sum.danger_distribution?sum.danger_distribution.critical||0:0)+'</span></div>'+
'<div class="stat"><span>'+t.high+'</span><span>'+(sum.danger_distribution?sum.danger_distribution.high||0:0)+'</span></div>'+
'<div class="stat"><span>'+t.aiStatus+'</span><span>'+(s.ai_analysis?'✅':'❌')+'</span></div>'+
(s.clone_time?'<div class="stat"><span>'+t.cloneTime+'</span><span>'+s.clone_time+'s</span></div>':'')+
'<div style="text-align:center;margin-top:12px"><a href="/map/'+sid+'?lang='+lang+'" style="color:#5b9eff;font-size:18px;text-decoration:none;font-weight:bold">'+t.viewMap+'</a></div>';
stats.style.display='block';
}
});
}else if(p.stage==='error'){
clearInterval(interval);
text.textContent='❌ '+(p.message||t.error);
btn.disabled=false;btn.textContent=t.analyze;
}
});
},1000);
})
.catch(function(e){
text.textContent='❌ '+e.message;
btn.disabled=false;btn.textContent=t.analyze;
});
}
</script>
